<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>AVAVOGUE — 時尚婚禮設計</title>

    <!-- （可選）Tailwind CDN：若你未設置 Tailwind 專案，先用 CDN 版即可 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 字體（可改成你的品牌字體） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { height: 100%; }
      body { font-family: Poppins, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      #root { min-height: 100%; }
    </style>
  </head>
  <body class="bg-white text-zinc-900">
    <div id="root"></div>

    <!-- 入口檔：你已經有的 src/app.jsx -->
    <script type="module" src="/src/app.jsx"></script>
  </body>
</html>
