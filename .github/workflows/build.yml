name: Build & Publish to gh-pages (Vite)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write  # needed to push to gh-pages branch

jobs:
  build-deploy:
    runs-on: ubuntu-22.04   # 👈 pin to a stable Ubuntu version

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install deps
        run: npm ci

      - name: 🏗️ Build (set base to /<repo>/)
        env:
          BASE_PATH: "/"
        run: |
          echo "Using BASE_PATH=$BASE_PATH"
          npm run build -- --base="$BASE_PATH"

      - name: 🚀 Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
